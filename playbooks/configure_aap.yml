---
- name: Configure Ansible Automation Platform
  hosts: "{{ env | default('dev') }}"
  connection: local
  gather_facts: false

  pre_tasks:
    - name: Include vars from vault
      ansible.builtin.include_vars:
        file: ../vaults/{{ env }}.yml
      tags:
        - always

    - name: Option not supported
      tags:
        # - controller_applications
        # - controller_bulk_host_create
        # - controller_credential_types
        # - controller_execution_environments
        # - controller_host_groups
        # - controller_hosts
        # - controller_instance_groups
        # - controller_instances
        # - controller_license
        # - controller_role_definitions
        # - controller_roles
        # - controller_settings
        # - eda_controller_tokens
        # - eda_credential_types
        # - eda_decision_environments
        # - gateway
        # - hub
        - never
      block:
        - name: Set unsupported_tag
          ansible.builtin.set_fact:
            unsupported_tag: true

        - name: Inform user unsupported option (tag)
          ansible.builtin.assert:
            that: not unsupported_tag | bool
            fail_msg: Option (tag) not supported by this version of configure_aap.yml      

  tasks:
    - name: INCLUDE_TASK | dispatch
      ansible.builtin.include_tasks:
        file: tasks/dispatch.yml

    - name: Configure Gateway
      when:
        - config_gateway | default(false) | bool
      tags:
        - gateway
      block:      
        - name: INCLUDE_TASK | configure_gateway_authenticators.yml
          ansible.builtin.include_tasks:
            file: tasks/configure_gateway_authenticators.yml
            apply: 
              tags: 
                - gateway_authenticators
                - gateway_authenticator_maps
          when:
            - config_gateway_authenticators | default(false) | bool
